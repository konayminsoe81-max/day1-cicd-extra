name: Cyber Arcade - CI/CD & GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test_and_build:
    name: Run Automated Tests & Build Game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CI Quality Gate Tests
        run: python -m unittest discover -s tests -v

      - name: Build Arcade Game Package
        run: python scripts/build_site.py

      - name: Save Downloadable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-arcade-build
          path: dist/
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: test_and_build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
